kotlin.code.style=official
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.daemon.jvmargs=-Xmx3g
# AGP 9 refuses to apply com.android.application alongside the Kotlin
# Multiplatform plugin: "not compatible with the
# 'org.jetbrains.kotlin.multiplatform' plugin since AGP 9.0". Its recommended
# fix is to swap in com.android.kotlin.multiplatform.library, which builds a
# LIBRARY and cannot produce the APK this app ships. These two flags are AGP's
# own documented alternative and keep the application plugin working.
#
# They are a stopgap and AGP says so: both are deprecated and removed in AGP 10.
# Before then this build has to move to the KMP library plugin plus a thin
# application module, which is a restructure, not a flag.
android.builtInKotlin=false
android.newDsl=false

# TWO Mapbox credentials, neither of them in this file. Put both in
# ~/.gradle/gradle.properties, which is outside the repository, or export them.
#
# MAPBOX_DOWNLOADS_TOKEN is an `sk.` maven credential. settings.gradle.kts uses
# it to download the Maps SDK at BUILD time. Without it the Mapbox repository is
# not declared and every Android task fails naming com.mapbox.maps; :jvmTest and
# compileKotlinJs are unaffected, because neither target uses the SDK.
#
# MAPBOX_PUBLIC_TOKEN is the `pk.` public token the SDK uses to fetch tiles at
# RUNTIME. It is injected as a buildConfigField and applied in
# KinfolkPortalApplication.onCreate. Use the UNRESTRICTED mobile token: Mapbox
# validates URL restrictions from a browser Referer and answers 403 to Maps SDK
# requests, so the URL-restricted web token would leave the map blank with a new
# cause. A build with no MAPBOX_PUBLIC_TOKEN succeeds and draws the Canvas
# polyline instead of a basemap, which is what shipped before issue #520.
