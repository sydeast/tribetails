name: CI

# WHERE THESE JOBS RUN is a repository variable, not a literal.
#
# `vars.CI_RUNNER` unset means `ubuntu-latest`, which is what this always was
# and what it goes back to by deleting the variable. Set it to `self-hosted`
# and every job moves to a registered runner instead.
#
# 2026-08-20: GitHub stopped starting jobs ("recent account payments have
# failed or your spending limit needs to be increased") and three PRs sat with
# a red X against zero executed steps. A self-hosted runner is the way to keep
# a real verdict on a PR without a hosted-minutes bill. Flipping back is one
# variable deletion, so nothing here is a one-way door.
#
# A self-hosted runner needs the SDKs the ubuntu images ship with. The Android
# jobs read `$ANDROID_HOME`; set it in the runner's own `.env` rather than here,
# so the workflow stays honest for hosted runners too.

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

# PULL REQUESTS share a group per branch and cancel: a second push to the same
# PR kills the first run rather than paying for a verdict on a commit nobody
# will merge.
#
# PUSHES TO MAIN get a group of their own per run, and never cancel. That is
# not a style choice, it is what the release gate requires. scripts/release.sh
# reads the check runs for the commit it is about to ship and maps them through
# `ci_verdict`, where `success|skipped|neutral` is a pass and EVERYTHING ELSE,
# `cancelled` included, is a fail (release.sh, the `ci_verdict` function). A
# cancelled run on main therefore does not mean "superseded", it means the gate
# refuses to release that commit until CI is re-run. In the fortnight before
# this change 50 of 170 push-to-main runs ended `cancelled`, i.e. roughly a
# third of main's commits carried a verdict the release gate would not accept.
#
# A shared group would still cancel even with `cancel-in-progress: false`,
# because a concurrency group holds one running plus one pending run and drops
# the pending one when a third arrives. During a merge burst that is exactly
# how a middle commit acquires a cancelled verdict. Giving every push its own
# group is the only form that guarantees no main run is ever cancelled by
# another main run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for the whole file: no job here writes to the repo, and a
# read-only token is what makes "this job must never push" enforced rather
# than asked nicely. The changes job re-declares its own block because the
# paths filter also needs pull-requests: read.
permissions:
  contents: read

# EVERY job below carries a `timeout-minutes`. GitHub's default is 360, so an
# untimed job that hangs parks a runner for six hours and bills every minute of
# it; issue #456 records this job file doing exactly that, for over four hours
# on one pull request run. The ceilings are sized from measured durations of
# recent successful runs, not guessed, and each one is annotated with what it
# was measured against so a future slowdown is raised deliberately rather than
# absorbed. Jobs that install dependencies get a floor of 10 minutes whatever
# their median, because below that the ceiling stops measuring the job and
# starts measuring npm registry latency.

jobs:
  changes:
    name: Detect changed paths
    # Measured median 0.2 min, max 0.3, over 58 successful runs. A checkout and
    # a paths filter, no install, so no registry latency to absorb.
    timeout-minutes: 5
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      adminE2e: ${{ steps.filter.outputs.adminE2e }}
      functions: ${{ steps.filter.outputs.functions }}
      android: ${{ steps.filter.outputs.android }}
      mytribe: ${{ steps.filter.outputs.mytribe }}
      mytribeRules: ${{ steps.filter.outputs.mytribeRules }}
      portal: ${{ steps.filter.outputs.portal }}
      mytribeGradle: ${{ steps.filter.outputs.mytribeGradle }}
      recorder: ${{ steps.filter.outputs.recorder }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # auntieos-admin and mytribe/web are npm workspace members as of
            # PR25a: they resolve against the ROOT package.json/package-lock.json,
            # not one of their own, and packages/geo is a workspace dependency
            # both apps import from. A change under any of the three must
            # trigger both this filter and `portal` below, or a break in
            # shared code, or a resolution change from a root-only dependency
            # bump, ships green.
            admin:
              - 'auntieos-admin/src/**'
              # index.html and firebase.json are here so that this filter is a
              # SUPERSET of preview.yml's `admin` filter. preview.yml no longer
              # runs the unit suite itself (it ran the identical `npm test` this
              # job runs, on the same commit, for another six minutes a PR), and
              # that is only safe while every path which triggers a preview also
              # triggers this job. Without these two lines an index.html-only or
              # firebase.json-only PR would deploy a preview and be tested by
              # nothing.
              - 'auntieos-admin/index.html'
              - 'auntieos-admin/firebase.json'
              - 'auntieos-admin/package.json'
              - 'auntieos-admin/tsconfig.json'
              - 'auntieos-admin/vite.config.ts'
              - 'auntieos-admin/vitest.config.ts'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            # Its own filter rather than a step inside `admin`, because this job
            # downloads Chromium and boots two emulators and so costs minutes
            # where the unit suite costs seconds. It still watches src/** and
            # the styles, since catching what a change there does in a REAL
            # browser is the entire reason the specs exist.
            #
            # Deliberately NOT watching packages/**: nothing under
            # auntieos-admin/src imports @tribetails/geo yet (that lands in
            # PR18), so a geo-only change has nothing here to exercise. Once
            # PR18 adds that import, add packages/** here too.
            adminE2e:
              - 'auntieos-admin/e2e/**'
              - 'auntieos-admin/e2e.firebase.json'
              - 'auntieos-admin/src/**'
              - 'auntieos-admin/web/firestore.rules'
              - 'auntieos-admin/package.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            functions:
              - 'auntieos-admin/web/functions/**'
              - '.github/workflows/ci.yml'
            android:
              - 'auntieos-admin/android/**'
            mytribe:
              - 'mytribe/functions/**'
              # The backfill and seed scripts sit outside functions/ but are
              # covered BY the functions job: both vitest configs include
              # ../scripts/test/**, and typecheck runs -p ../scripts/tsconfig.json
              # since PR #184. Without this line that coverage never fires, which
              # is how those scripts stayed broken under firebase-admin ^14.
              - 'mytribe/scripts/**'
              # Every other filter in this block self-triggers on the workflow
              # file; mytribe was the one that did not, so a change to the job's
              # own definition never re-ran it. Proven on the PR that added the
              # line above: MyTribe functions reported "skipping".
              - '.github/workflows/ci.yml'
              # ADR-0001: the generated Contracts module is committed INSIDE the
              # consuming projects, so the regen gate has to run when one of
              # those copies changes too. Without these lines a hand edit to a
              # generated file under auntieos-admin/ would be reviewed by the
              # admin job, which does not know the file is generated.
              - 'mytribe/web/src/contracts/**'
              - 'auntieos-admin/src/contracts/**'
              - 'auntieos-admin/android/app/src/main/java/com/tribetails/auntieos/data/contracts/**'
            # Its own filter for the same reason `adminE2e` has one: the rules
            # suite boots the Firestore emulator, so it costs minutes where the
            # `mytribe` unit job costs seconds, and it must not be paid for by
            # every functions PR.
            #
            # The two lines outside functions/ are the point of a separate
            # filter. test/rules/setup.ts reads
            # `resolve(__dirname, '../../../firestore.rules')`, i.e.
            # mytribe/firestore.rules, and `firebase emulators:exec` runs from
            # mytribe/functions/ (which has no firebase.json of its own) so the
            # CLI walks up to mytribe/firebase.json for the emulator ports and
            # the rules path. Neither file is under `mytribe/functions/**`, so
            # without these lines the ONLY job that reads the rules file would
            # not run on a change to the rules file. Compare adminE2e above,
            # which carries auntieos-admin/web/firestore.rules for this reason.
            mytribeRules:
              - 'mytribe/functions/**'
              - 'mytribe/firestore.rules'
              - 'mytribe/firebase.json'
              - '.github/workflows/ci.yml'
            portal:
              - 'mytribe/web/**'
              # Same reason as `auntieos-admin/firebase.json` on the `admin`
              # filter: preview.yml's `portal` filter watches it, preview.yml no
              # longer runs the portal unit suite, so this job has to be the one
              # that covers a firebase.json-only change.
              - 'mytribe/firebase.json'
              # See the comment on `admin` above: mytribe/web is a workspace
              # member too, resolving against the root lockfile and importing
              # packages/geo.
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            mytribeGradle:
              - 'mytribe/build.gradle.kts'
              - 'mytribe/settings.gradle.kts'
              - 'mytribe/src/**'
              - 'mytribe/gradle/**'
              - '.github/workflows/ci.yml'
            # Its own filter even though `admin` and `portal` both already
            # watch 'packages/**', because what those two jobs do with a
            # recorder change is not the same as running the recorder's tests.
            #
            # Both apps import '@tribetails/issue-recorder' from their
            # main.tsx, so their typechecks do reach its src/ through the
            # workspace symlink. Neither reaches its *.test.ts files, which are
            # outside both apps' tsconfig include, and neither runs a single
            # one of them: before this job the package had no test script and
            # no runner anywhere in CI. It also typechecks under stricter flags
            # than either app sets (noUncheckedIndexedAccess,
            # exactOptionalPropertyTypes in packages/issue-recorder/tsconfig.json),
            # so its own tsc is not a repeat of theirs either.
            #
            # Cheap on purpose: no emulators, no browser, no build. It watches
            # the root lockfile because the package resolves vitest from the
            # workspace root rather than a lockfile of its own, the same way
            # `admin` and `portal` do.
            recorder:
              - 'packages/issue-recorder/**'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  admin:
    name: React admin
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    # Measured median 6.3 min, max 6.7, over 37 successful runs, and 5.8 of
    # those minutes are the vitest suite alone. Roughly 2.4x the median.
    timeout-minutes: 15
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: auntieos-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Root lockfile: auntieos-admin is an npm workspace member as of
          # PR25a (see package.json's "workspaces"), so its deps resolve at
          # the repo root, not from a lockfile of its own.
          cache-dependency-path: package-lock.json
      # Overrides the job default so the install runs where the workspace
      # root (and its lockfile) actually is. Every later step keeps the job
      # default of auntieos-admin.
      - run: npm ci
        working-directory: .
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  admin-e2e:
    name: React admin e2e
    needs: changes
    if: needs.changes.outputs.adminE2e == 'true' || github.event_name == 'workflow_dispatch'
    # THE KNOWN OFFENDER (#456). This ceiling is the backstop, not the bound:
    # the two steps that can stall carry their own caps below, and this number
    # only has to be large enough that one of THOSE always fires first. If the
    # job ceiling wins instead, the run is torn down and the `if: failure()`
    # upload never happens, which is how three hangs were recorded with no
    # evidence attached.
    #
    # The arithmetic, in the worst case each part has actually been measured at
    # over the last 58 successful runs of this job: set-up-job 5s, checkout 8s,
    # setup-node 10s, setup-java 1s, npm ci 15s and firebase-tools 48s, so
    # about 1.5 minutes before the first capped step starts. Then Install
    # Chromium at its 5 minute cap, E2E at its 7 minute cap, and roughly half a
    # minute for the artifact upload and the post steps. 1.5 + 5 + 7 + 0.5 is
    # 14, so 15 leaves a minute of slack. Change any step cap here and redo
    # this sum; a stale one is worse than none.
    timeout-minutes: 15
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: auntieos-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Root lockfile: see the `admin` job above.
          cache-dependency-path: package-lock.json
      # The Firestore emulator is a JAR. Without a JDK it fails at startup with
      # a message about `java`, several steps away from anything that looks
      # like a test.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: .
      # Pinned. firebase-tools ships emulator behaviour changes in minor
      # releases, and an unpinned global install turns an upstream release into
      # a red build on a PR that touched nothing.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.18.0
      # THIS IS WHERE #456 HUNG. Not in a spec, not on a missing callable stub,
      # not on a port nothing was serving. Three parked runs on 2026-08-18,
      # 32092836420 for 6h00m, 32183117374 for 45m and 32184677098 for 4h23m,
      # all stop on the same line and leave the same orphan behind:
      #
      #   Get:5 https://archive.ubuntu.com/ubuntu noble-security InRelease
      #   ...silence...
      #   Terminate orphan process: npm exec playwright install --with-deps chromium
      #
      # `--with-deps` shells out to `apt-get`. The runner points apt at
      # azure.archive.ubuntu.com, that mirror answers `Ign:` on every index, apt
      # falls back to archive.ubuntu.com mid-transaction, and there it can sit
      # forever: nothing in the chain has a deadline, so a stalled mirror became
      # a stalled job and then a stalled merge queue. The same fault shows up
      # short of infinite too. Install Chromium has a median of 27s across the
      # last 58 successful runs, and a tail of 116, 176, 234, 372 and 552s that
      # is this stall recovering rather than parking.
      #
      # So the deadline lives here, and it is a `timeout` rather than only the
      # step's `timeout-minutes` because the step cap prints "The operation was
      # canceled" and nothing else, which is exactly what made three of these
      # indistinguishable from a hung test. `timeout` exits 124, and 124 gets
      # the message below, which names apt and the mirror.
      #
      # The fallback is what keeps a mirror fault from being a red build. On
      # this runner image `--with-deps` installs NO libraries: every one
      # chromium links against is already the newest version there, and the
      # nine packages apt actually adds are CJK, Thai and Cyrillic fonts
      # (fonts-ipafont-gothic, fonts-wqy-zenhei, xfonts-cyrillic and friends).
      # Nothing in this suite renders those scripts. `typography.spec.ts` and
      # `cascade.spec.ts` assert about Fraunces, Hanken Grotesk and Spline Sans
      # Mono, which ship in the app bundle from @fontsource. So when apt stalls
      # we drop to the browser-only install, which downloads from Playwright's
      # own CDN and never touches a Ubuntu mirror, and say so in the log.
      #
      # Losing the deps for real is still a failure, just a legible one: if a
      # future runner image stops carrying a library, Playwright refuses to
      # launch with "Host system is missing dependencies to run browsers" and
      # names the missing libraries, inside the capped E2E step below, with the
      # artifact upload still running.
      - name: Install Chromium
        # The outer belt. The inner deadlines add up to at most 260s including
        # both kill-afters, so this only ever fires if `timeout` itself was
        # defeated.
        timeout-minutes: 5
        run: |
          # GitHub runs a `run:` block as `bash -e`, which would abort the step
          # the moment the first install exits non-zero and never reach the
          # fallback. This step decides what to do with each exit code itself.
          set +e
          set -uo pipefail

          # 150s: the slowest honest run of this step measured 176s, and
          # everything past about 120s is already the stall recovering rather
          # than a healthy download, so falling back is the faster answer for
          # those too.
          timeout --kill-after=10s 150 npx playwright install --with-deps chromium
          status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # `timeout` reports 124 when it sent TERM and 137 when it had to
          # follow up with KILL. Any other code is the install genuinely
          # failing, which is a different bug and must not be retried into
          # silence.
          if [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            echo "::error title=Chromium install failed::playwright install --with-deps chromium exited $status. This is not the #456 stall, which exits 124 or 137. Read the step log above for what apt or Playwright actually said."
            exit "$status"
          fi

          echo "::warning title=Ubuntu mirror stalled::apt-get did not finish within 150s, which is the #456 stall. Retrying without --with-deps, which skips apt entirely."
          # 90s: the browser download itself takes about 9s when the network is
          # healthy, so this only has to survive a slow CDN, not a stalled one.
          timeout --kill-after=10s 90 npx playwright install chromium
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "Chromium installed without --with-deps. The runner image already carries every library it needs; only the optional CJK, Thai and Cyrillic fonts were skipped."
            exit 0
          fi
          echo "::error title=Chromium install timed out::Neither playwright install --with-deps chromium (150s, apt-get against the runner Ubuntu mirror) nor the browser-only fallback (90s, exit $status, Playwright CDN) finished. Both network paths are down, so this is infrastructure rather than a code change. See #456, then re-run the job."
          exit 1
      # No Firebase credentials anywhere in this job, deliberately. The
      # emulators run entirely offline against a throwaway project id, so
      # nothing here can read or write real data even if a spec is wrong.
      # A STEP timeout as well as the job one, and the difference matters. When
      # the JOB ceiling fires the run is torn down and `if: failure()` steps do
      # not run, so the traces that would say what hung are never uploaded. When
      # this STEP times out it fails like any other failing step, the upload
      # below runs, and #456 gets evidence instead of another silent park.
      #
      # This step is the tightly clustered one: over the last 58 successful runs
      # the median is 198s and the maximum is 215s, a spread of 17 seconds. 7
      # minutes is about 2x the worst of those, so a real regression in the
      # suite still has room and a genuine hang inside Playwright is caught
      # within a couple of minutes of it starting.
      #
      # The step cap only helps if it fires BEFORE the job ceiling; see the
      # arithmetic on `timeout-minutes` at the top of this job, and redo it
      # there if this number changes.
      - name: E2E
        timeout-minutes: 7
        run: npm run e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          # Traces and screenshots are written only for failures, which is
          # exactly when a red CI run is otherwise unreadable from the log.
          path: auntieos-admin/e2e/.artifacts/
          retention-days: 7
          if-no-files-found: ignore

  functions:
    name: AuntieOS functions
    needs: changes
    if: needs.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: auntieos-admin/web/functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auntieos-admin/web/functions/package-lock.json
      - run: npm ci
      # The generate tests read the brand-voice corpus from web/functions/voice/,
      # which is gitignored on purpose (it carries per-client material). Those
      # specific tests are skipped in CI rather than shipping the corpus to a
      # runner. Everything else, including the whole rate limiter and the rules
      # mirror, runs normally.
      - name: Tests
        run: npm test

  mytribe-functions:
    name: MyTribe functions
    needs: changes
    if: needs.changes.outputs.mytribe == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 12
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: mytribe/functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mytribe/functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      # ADR-0001 decision 3: regenerate the Contracts module from the zod
      # schemas and fail on any difference, so a schema change and its
      # generated fallout land in one reviewable commit. Early, so a stale
      # artifact is reported as staleness here rather than as a client compile
      # error in another job that cannot explain it.
      - run: npm run contracts:check
      # The same gate, for the same reason, over the notification template seed
      # corpus. The bundled module is what the importer callable reads in
      # production, because mytribe/seeds/ sits outside the functions deploy
      # root, so a seed file edited without regenerating would quietly import
      # the old wording.
      - run: npm run seeds:check
      - run: npm run build
      # `build` compiles src/ only. `typecheck` is what reaches the three
      # tsconfigs nothing else in CI reads: tsconfig.test.json (test/**),
      # scripts/tsconfig.json, and ../scripts/tsconfig.json. Without this
      # step a test file can reference a field a src/ type no longer has and
      # stay green forever, because vitest transpiles rather than
      # typechecks. That is what happened to
      # test/lockedChannelRenderTruth.test.ts when `enabled` became required
      # on BusinessNotificationOverride: the suite passed on main while
      # `npm run typecheck` failed for anyone who ran it locally.
      - run: npm run typecheck
      # test:ci runs the in-project functions suite. Plain `npm test` also globs
      - run: npm run test:ci

  # test/rules/** is excluded from BOTH vitest configs on purpose
  # (vitest.config.ts:15, vitest.ci.config.ts:31) because it needs a Firestore
  # emulator the unit suites must not depend on. The consequence, until this
  # job, was that nothing ran it: not `npm test`, not `npm run test:ci`, not
  # scripts/preflight.sh (which names test:rules at :103 and :134 only as
  # message text inside a firebase-CLI-installed check). It ran when a human
  # remembered to type it, which is how a suite decays into one nobody can run.
  #
  # A sibling job rather than three more steps on `mytribe functions`: that job
  # is currently fast and pure, and this one installs a JDK, installs a global
  # npm package and boots an emulator. Splitting also makes a red rules run
  # legible under its own name instead of buried in a job called something else.
  # Same trade `adminE2e` already makes against `admin`.
  mytribe-rules:
    name: MyTribe Firestore rules
    needs: changes
    if: needs.changes.outputs.mytribeRules == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: mytribe/functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # mytribe/functions is NOT an npm workspace member (the root
          # package.json lists packages/*, auntieos-admin and mytribe/web only),
          # so it installs from its own lockfile. Same as `mytribe functions`.
          cache-dependency-path: mytribe/functions/package-lock.json
      # The Firestore emulator is a JAR. Without a JDK it fails at startup with
      # a message about `java`, several steps away from anything that looks
      # like a test. 21 to match the e2e job above; the emulator's own floor is
      # lower, so this is "same as its sibling" rather than a minimum.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Pinned, and pinned to the SAME version as the e2e job: firebase-tools
      # ships emulator behaviour changes in minor releases, and an unpinned
      # global install turns an upstream release into a red build on a PR that
      # touched nothing.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.18.0
      # `test:rules` is `firebase emulators:exec --only firestore --project
      # mytribe-rules-test "vitest run --config vitest.rules.config.ts"`. The
      # exec wrapper is what exports FIRESTORE_EMULATOR_HOST into the child,
      # and notificationPrefsRoundTrip.test.ts is `describe.skipIf(!EMULATOR)`
      # — so running vitest against this config WITHOUT the wrapper would
      # report green having run nothing. Always go through the npm script.
      #
      # No Firebase credentials in this job, deliberately: the emulator runs
      # offline against a throwaway project id, so nothing here can touch real
      # data even if a test is wrong.
      - name: Firestore rules tests
        run: npm run test:rules

  portal:
    name: Kinfolk portal
    needs: changes
    if: needs.changes.outputs.portal == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: mytribe/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Root lockfile: mytribe/web is an npm workspace member as of
          # PR25a (see package.json's "workspaces"), so its deps resolve at
          # the repo root, not from a lockfile of its own.
          cache-dependency-path: package-lock.json
      # Overrides the job default so the install runs where the workspace
      # root (and its lockfile) actually is. Every later step keeps the job
      # default of mytribe/web.
      - run: npm ci
        working-directory: .
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  recorder:
    name: Issue recorder
    needs: changes
    if: needs.changes.outputs.recorder == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/issue-recorder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Root lockfile: packages/* are npm workspace members (see the root
          # package.json's "workspaces"), so this package's vitest resolves at
          # the repo root, not from a lockfile of its own.
          cache-dependency-path: package-lock.json
      # Overrides the job default so the install runs where the workspace root
      # (and its lockfile) actually is. Every later step keeps the job default
      # of packages/issue-recorder.
      - run: npm ci
        working-directory: .
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      # No production build step, unlike `admin` and `portal`. This package has
      # no bundle that ships: `build:bookmarklet` is run by each app's
      # `prebuild`, so it is already exercised by those two jobs, and running it
      # a third time here would gate the recorder's tests on a build nobody
      # deploys from.

  deploy-guard:
    name: Deploy guard
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Run the deploy-guard test if present
        run: |
          if [ -f scripts/safe-deploy.test.sh ]; then
            bash scripts/safe-deploy.test.sh
          else
            echo "scripts/safe-deploy.test.sh not present yet, skipping."
          fi
      # Same job rather than its own, because it needs the same checkout and
      # nothing else: a second runner to shell out to bash buys a slower gate.
      #
      # It is here because on 2026-08-03 the prune reported "903 revisions
      # removed, 0 remaining" for a run that deleted at most 197, over a region
      # that still held 240 serving revisions. The count was a listing minus a
      # listing, and the second listing came back empty and exited 0. This test
      # fails against that version of the script.
      - name: Run the prune accounting test if present
        run: |
          if [ -f scripts/prune-run-revisions.test.sh ]; then
            bash scripts/prune-run-revisions.test.sh
          else
            echo "scripts/prune-run-revisions.test.sh not present yet, skipping."
          fi
      # The wrapper's job is to launch a release when nobody can answer a
      # prompt, so its refusals are the part worth gating: it must not skip the
      # index confirmation on a release that changes indexes, and it must not
      # start a second release while one is running.
      - name: Run the detached-release wrapper test if present
        run: |
          if [ -f scripts/release-bg.test.sh ]; then
            bash scripts/release-bg.test.sh
          else
            echo "scripts/release-bg.test.sh not present yet, skipping."
          fi
      # This job is where the workflow files check themselves. The `scripts`
      # filter watches ci.yml, so adding a job here is enough to re-run this,
      # and the test refuses a job that carries no timeout-minutes. Without it
      # the fix for #456 lasts exactly until the next job somebody adds, which
      # would silently inherit GitHub's six-hour default again.
      - name: Run the workflow budget test if present
        run: |
          if [ -f scripts/workflow-budget.test.sh ]; then
            bash scripts/workflow-budget.test.sh
          else
            echo "scripts/workflow-budget.test.sh not present yet, skipping."
          fi
  mytribe-gradle:
    name: Portal shared (jvm + android unit + js)
    needs: changes
    if: needs.changes.outputs.mytribeGradle == 'true' || github.event_name == 'workflow_dispatch'
    # Raised from 15 with the testDebugUnitTest step below (issue #473), which
    # makes this the first job to build the mytribe ANDROID target at all.
    # Measured on run 32223068657, the first one to carry both steps: 2m15s for
    # :jvmTest and 2m15s for testDebugUnitTest, 4m44s for the whole job. 20 is
    # roughly four times that, which is the headroom the old ceiling gave the
    # jvm-only job.
    timeout-minutes: 20
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: mytribe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      # The authoritative task for mytribe/src: it runs commonTest and the
      # Compose UI tests in composeUiTest. See mytribe/CLAUDE.md.
      - run: ./gradlew :jvmTest --no-daemon
      # The Android unit-test variant. Nothing ran it until issue #473, by which
      # point it was failing 143 of its 524 tests on a clean main. It passes
      # now, and it only stays passing if something runs it.
      - run: ./gradlew testDebugUnitTest --no-daemon
      # The js target, which nothing had ever compiled (issue #507). It arrived
      # in the 2026-07-20 subtree import and stopped compiling somewhere in the
      # Kotlin 2.2.20 -> 2.4.10 dependabot bumps, because `org.w3c.fetch.fetch`
      # lost the default for its `init` parameter and one GET in jsMain was
      # relying on it. A month of gradle bumps landed green on top of a target
      # none of them built. This is the cheapest task that would have caught it:
      # there is no jsTest source set, so compiling IS the gate.
      - run: ./gradlew compileKotlinJs --no-daemon
  # composeApp builds the desktop (jvm) app, which per auntieos-admin/CLAUDE.md
  # is off the delivery path by owner ruling: desktop parity is paused. It also
  # built a wasm admin until #481 deleted it, superseded by src/. No
  # PR needs this to go green, so it no longer runs on the path-filter
  # trigger. To run it, dispatch the workflow by hand: gh workflow run ci.yml
  # --ref <branch>, or Actions tab -> CI -> Run workflow. Note a dispatch runs
  # EVERY job gated on workflow_dispatch, not just this one; GitHub offers no
  # per-job dispatch.
  kotlin:
    name: Shared + desktop (jvm)
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: auntieos-admin/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :composeApp:jvmTest --no-daemon

  android:
    name: Android unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: auntieos-admin/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # local.properties is gitignored (it holds the keystore and SDK paths), so
      # CI writes the one line the SDK needs. Release signing is NOT available
      # here, which is why this runs the debug unit tests and never assembles a
      # release.
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The Mapbox SDK comes from Mapbox's private Maven repo, which needs a
      # downloads token. That is an EXTERNAL secret only the operator can issue,
      # so the job reports honestly instead of failing every PR until it exists.
      # A green "skipped" here means android was NOT tested, which is why it says
      # so loudly rather than quietly passing.
      - name: Check for Mapbox token
        id: mapbox
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Android unit tests
        if: steps.mapbox.outputs.present == 'true'
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Report skipped
        if: steps.mapbox.outputs.present != 'true'
        run: |
          echo "::warning title=Android tests skipped::MAPBOX_DOWNLOADS_TOKEN is not set, so the Mapbox SDK cannot be resolved and the android suite did NOT run."
          echo "Set it with: gh secret set MAPBOX_DOWNLOADS_TOKEN --repo sydeast/tribetails"
