name: E2E real services

# THE ADMIN AND PORTAL CYPRESS SUITES AGAINST REAL FUNCTIONS AND REAL OUTSIDE
# (#1089, operator ruling D3, 2026-10-01). Gated on releases, not on pull
# requests: a public repo's PR runs cannot read secrets, and this run needs them.
#
# What runs: `npm run e2e:real` in auntieos-admin (job admin-real) and in
# mytribe/web (job portal-real, #1194). Each builds mytribe/functions (the
# admin job also serves the admin's own web/functions beside it, #1201), writes
# its emulator secrets files from the environment below (refusing a live Stripe
# key, a business or private phone number, or a spec that could press Google
# Calendar Disconnect), boots auth + Firestore + functions under a demo- project
# id, and runs its own `cypress.real.config.ts`. The portal job also installs
# the Stripe CLI: paying an invoice is settled by `stripeWebhook`, and
# `stripe listen` is what delivers that event to the emulator. The jobs run on
# separate runners, so the emulator ports they share never meet. See
# auntieos-admin/docs/runbooks/e2e.md, "The real-services run" and "The
# portal's real-services run".
#
# SECRETS come from two places (#1264, operator ruling 2026-10-31):
#   - Stripe and Twilio, test-only, and the test calendar's id and refresh
#     token: the GitHub environment `e2e-real`, whose deployment branch policy
#     is `main` only;
#   - Cloudinary, smtp2go (with EMAIL_FROM) and the Google OAuth client: Secret
#     Manager in auntieos-ttpc, read by explicit allowlisted name through the
#     nightly's Workload Identity (auntieos-admin/scripts/e2e-real/
#     secret-manager.mjs). An E2E_* secret stored in `e2e-real` under the same
#     name wins over Secret Manager. Each value is masked before anything else
#     is written about it, and the Google credentials are dropped before the
#     emulator boots, so the explicit read is the only Secret Manager read.
# A vendor whose values are not available is not a failure: its specs skip
# with the missing variable named in the log.
#
# VERDICT (D3-e). A red run means our integration broke and the release stops.
# A vendor outage (a 5xx or timeout while the vendor's status page shows an
# incident) only warns. run.sh classifies the run into
# cypress/.real/verdict.json (`stop`, `warn` or `pass`, #1196) and exits 1 only
# on `stop`, so a warning is a green job; the file is uploaded below so the
# release can say so. A run from before the classifier has no file, and its
# red is read by a person before a release is forced past it.
#
# WHO READS IT (#1193). nightly-release.yml calls this workflow for the commit
# it ships, before its release job, and that job refuses unless it came back
# green. scripts/release.sh step 0b reads the verdict again for the commit,
# hosted and local alike: the newest run of this file or of a nightly that
# called it, then the verdict files in that run's artifacts.

on:
  workflow_dispatch:
  # The nightly release calls this for the commit it is about to ship (#1193).
  # A called workflow gets no run of its own: its jobs run inside the
  # nightly's run, named "E2E real services / <job>", and release.sh looks
  # for them there.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-real-${{ github.sha }}
  cancel-in-progress: false

jobs:
  admin-real:
    name: Admin Cypress, real services
    # Main only, matching the environment's branch policy, so a dispatch from
    # any other branch skips here instead of failing at the environment gate.
    if: github.ref == 'refs/heads/main'
    environment: e2e-real
    # id-token: the OIDC token Workload Identity exchanges for the read-only
    # Secret Manager access below (#1264).
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # Functions build plus three emulators plus real vendor round trips. Local
    # runs are a few minutes; this is headroom, and a cap the deploy guard needs.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: auntieos-admin
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      TWILIO_TEST_ACCOUNT_SID: ${{ secrets.TWILIO_TEST_ACCOUNT_SID }}
      TWILIO_TEST_AUTH_TOKEN: ${{ secrets.TWILIO_TEST_AUTH_TOKEN }}
      E2E_GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_CALENDAR_REFRESH_TOKEN }}
      E2E_GOOGLE_CALENDAR_ID: ${{ secrets.E2E_GOOGLE_CALENDAR_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mytribe/functions/package-lock.json
            auntieos-admin/web/functions/package-lock.json
      # The Firestore emulator is a JAR. 21 to match ci.yml's emulator jobs.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        working-directory: .
      # The functions emulator serves mytribe/functions/lib, so it needs its
      # own install; run.sh builds it.
      - run: npm ci
        working-directory: mytribe/functions
      # The admin's own codebase (signCloudinaryUpload, generateAuntieCopy) is
      # served too (#1201). Plain JS, no build, and not a root workspace, so
      # the root install does not cover it; run.sh refuses without it.
      - run: npm ci
        working-directory: auntieos-admin/web/functions
      # Pinned to the same version as ci.yml's emulator jobs.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.18.0
      # #1264. Workload Identity for the explicit Secret Manager read only.
      # Same provider and account as nightly-release.yml; the provider admits
      # this repository on refs/heads/main, which the job's `if` already
      # requires.
      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.NIGHTLY_WIF_PROVIDER }}
          service_account: ${{ vars.NIGHTLY_SERVICE_ACCOUNT }}
          project_id: auntieos-ttpc
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      # Reads ONLY the allowlisted names (Cloudinary, smtp2go, EMAIL_FROM,
      # Google OAuth), never Stripe or Twilio. Masks every value before it
      # writes anything else, then exports them through GITHUB_ENV. A secret
      # stored in `e2e-real` under one of the E2E_* names below is used
      # instead of Secret Manager, so the operator can override one.
      - name: Vendor values from Secret Manager
        working-directory: .
        env:
          E2E_SMTP2GO_API_KEY: ${{ secrets.E2E_SMTP2GO_API_KEY }}
          E2E_EMAIL_FROM: ${{ secrets.E2E_EMAIL_FROM }}
          E2E_CLOUDINARY_CLOUD_NAME: ${{ secrets.E2E_CLOUDINARY_CLOUD_NAME }}
          E2E_CLOUDINARY_API_KEY: ${{ secrets.E2E_CLOUDINARY_API_KEY }}
          E2E_CLOUDINARY_API_SECRET: ${{ secrets.E2E_CLOUDINARY_API_SECRET }}
          E2E_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.E2E_GOOGLE_OAUTH_CLIENT_ID }}
          E2E_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.E2E_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: node auntieos-admin/scripts/e2e-real/secret-manager.mjs --github
      # The emulator must have no Google credentials (#1089): with none and a
      # demo- project id there is no Secret Manager for it to reach. Revoke
      # gcloud's login, delete the credentials file and blank every variable
      # the auth step exported, before anything else runs.
      - name: Drop Google credentials
        if: always()
        working-directory: .
        run: |
          gcloud auth revoke --all --quiet >/dev/null 2>&1 || true
          for f in "${GOOGLE_GHA_CREDS_PATH:-}" "${GOOGLE_APPLICATION_CREDENTIALS:-}"; do
            if [ -n "$f" ]; then rm -f "$f"; fi
          done
          for v in GOOGLE_APPLICATION_CREDENTIALS GOOGLE_GHA_CREDS_PATH CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE CLOUDSDK_CORE_PROJECT CLOUDSDK_PROJECT GCLOUD_PROJECT GCP_PROJECT GOOGLE_CLOUD_PROJECT; do
            echo "$v=" >> "$GITHUB_ENV"
          done
      - name: Cypress, real services
        run: npm run e2e:real
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-real-artifacts
          # The emulator log carries function output, which is where a vendor
          # refusal shows; screenshots exist only for failures. verdict.json is
          # the run's classification (#1196), which release.sh downloads by
          # this artifact's name (#1193); a run before the classifier has none,
          # and if-no-files-found below keeps that quiet. The secrets files
          # are never here: run.sh deletes both, and neither path is listed.
          #
          # Hidden directories: upload-artifact skips a hidden file only when
          # its glob walk reaches one below the path it was given. Each path
          # here names its hidden component outright, so include-hidden-files
          # is not needed.
          path: |
            auntieos-admin/cypress/.artifacts/real/
            auntieos-admin/cypress/.real/emulators.log
            auntieos-admin/cypress/.real/verdict.json
          retention-days: 7
          if-no-files-found: ignore

  portal-real:
    name: Portal Cypress, real services
    if: github.ref == 'refs/heads/main'
    environment: e2e-real
    # id-token: the OIDC token Workload Identity exchanges for the read-only
    # Secret Manager access below (#1264).
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mytribe/web
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
      TWILIO_TEST_ACCOUNT_SID: ${{ secrets.TWILIO_TEST_ACCOUNT_SID }}
      TWILIO_TEST_AUTH_TOKEN: ${{ secrets.TWILIO_TEST_AUTH_TOKEN }}
      E2E_GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.E2E_GOOGLE_CALENDAR_REFRESH_TOKEN }}
      E2E_GOOGLE_CALENDAR_ID: ${{ secrets.E2E_GOOGLE_CALENDAR_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mytribe/functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        working-directory: .
      - run: npm ci
        working-directory: mytribe/functions
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.18.0
      - name: Install Stripe CLI
        working-directory: .
        env:
          STRIPE_CLI_VERSION: 1.55.1
          STRIPE_CLI_SHA256: c7a1eb723ecd29aaa3c7ec3d16139d6f01126ea9df91bb6a161b9616ad8fba68
        run: |
          tarball="stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/$tarball"
          echo "$STRIPE_CLI_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stripe-cli"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/stripe-cli" stripe
          echo "$RUNNER_TEMP/stripe-cli" >> "$GITHUB_PATH"
      # #1264. Workload Identity for the explicit Secret Manager read only.
      # Same provider and account as nightly-release.yml; the provider admits
      # this repository on refs/heads/main, which the job's `if` already
      # requires.
      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.NIGHTLY_WIF_PROVIDER }}
          service_account: ${{ vars.NIGHTLY_SERVICE_ACCOUNT }}
          project_id: auntieos-ttpc
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      # Reads ONLY the allowlisted names (Cloudinary, smtp2go, EMAIL_FROM,
      # Google OAuth), never Stripe or Twilio. Masks every value before it
      # writes anything else, then exports them through GITHUB_ENV. A secret
      # stored in `e2e-real` under one of the E2E_* names below is used
      # instead of Secret Manager, so the operator can override one.
      - name: Vendor values from Secret Manager
        working-directory: .
        env:
          E2E_SMTP2GO_API_KEY: ${{ secrets.E2E_SMTP2GO_API_KEY }}
          E2E_EMAIL_FROM: ${{ secrets.E2E_EMAIL_FROM }}
          E2E_CLOUDINARY_CLOUD_NAME: ${{ secrets.E2E_CLOUDINARY_CLOUD_NAME }}
          E2E_CLOUDINARY_API_KEY: ${{ secrets.E2E_CLOUDINARY_API_KEY }}
          E2E_CLOUDINARY_API_SECRET: ${{ secrets.E2E_CLOUDINARY_API_SECRET }}
          E2E_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.E2E_GOOGLE_OAUTH_CLIENT_ID }}
          E2E_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.E2E_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: node auntieos-admin/scripts/e2e-real/secret-manager.mjs --github
      # The emulator must have no Google credentials (#1089): with none and a
      # demo- project id there is no Secret Manager for it to reach. Revoke
      # gcloud's login, delete the credentials file and blank every variable
      # the auth step exported, before anything else runs.
      - name: Drop Google credentials
        if: always()
        working-directory: .
        run: |
          gcloud auth revoke --all --quiet >/dev/null 2>&1 || true
          for f in "${GOOGLE_GHA_CREDS_PATH:-}" "${GOOGLE_APPLICATION_CREDENTIALS:-}"; do
            if [ -n "$f" ]; then rm -f "$f"; fi
          done
          for v in GOOGLE_APPLICATION_CREDENTIALS GOOGLE_GHA_CREDS_PATH CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE CLOUDSDK_CORE_PROJECT CLOUDSDK_PROJECT GCLOUD_PROJECT GCP_PROJECT GOOGLE_CLOUD_PROJECT; do
            echo "$v=" >> "$GITHUB_ENV"
          done
      - name: Cypress, real services
        run: npm run e2e:real
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-real-portal-artifacts
          path: |
            mytribe/web/cypress/.artifacts/real/
            mytribe/web/cypress/.real/emulators.log
            mytribe/web/cypress/.real/stripe-listen.log
          retention-days: 7
          if-no-files-found: ignore
