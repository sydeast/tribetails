name: PR preview

# Deploys each web app to a Firebase Hosting PREVIEW CHANNEL and comments the
# URL on the pull request, so a change can be looked at before it merges.
#
# Why Firebase preview channels and not Vercel: both apps depend on Hosting
# rewrites that map onto Cloud Functions. The admin maps /api/generate,
# /api/send-message and /api/cloudinary/sign-upload (auntieos-admin/firebase.json);
# the portal maps /share/** onto getSharedKinTalePage (mytribe/firebase.json). A
# Vercel preview would carry neither, so Ask Auntie, broadcast send, media upload
# and shared KinTale pages would all be broken in every preview, which is exactly
# the kind of change most worth previewing. A preview channel is the same
# platform as production, so what you look at behaves like the real thing.
#
# The channel is per pull request and expires on its own, so old previews do not
# pile up against a site's channel limit.
#
# BOTH APPS, since 2026-08-16. Until then this file deployed the admin only, so
# a portal change could not be clicked before it merged: the one half of the
# product whose defects get found by walking it was the half with no preview.
# A portal-only PR published an admin URL and looked like it had been previewed.
#
# SHARED CHANGES PREVIEW BOTH. `packages/**` and the root lockfile are inputs to
# each app's bundle, so a change to either is a change to both, and previewing
# only one would leave the other's regression to be found in production.

on:
  pull_request:
    branches: ['**']
    # The UNION of what the two jobs care about. The per-app split is the
    # `changes` job below; a workflow-level path filter cannot express it,
    # because `paths` gates the whole file.
    paths:
      - 'auntieos-admin/src/**'
      - 'auntieos-admin/index.html'
      - 'auntieos-admin/package.json'
      - 'auntieos-admin/vite.config.ts'
      - 'auntieos-admin/firebase.json'
      - 'mytribe/web/src/**'
      - 'mytribe/web/index.html'
      - 'mytribe/web/public/**'
      - 'mytribe/web/package.json'
      - 'mytribe/web/vite.config.ts'
      - 'mytribe/firebase.json'
      # Both apps are npm workspace members (PR25a): they resolve against the
      # ROOT package.json/package-lock.json, not one of their own, and
      # packages/geo is a workspace dependency both declare. Same reasoning as
      # ci.yml's `admin` and `portal` jobs.
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview.yml'

# Left cancelling, unlike ci.yml's group. This workflow triggers on
# `pull_request` only, so no run here is ever the one the release gate reads on
# main, and a superseded preview is a preview of a commit nobody will look at.
concurrency:
  group: preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Every job carries a `timeout-minutes`; GitHub's default of 360 would let a
# hung deploy park a runner for six hours. Ceilings are sized from measured
# durations of recent successful runs. See the same block in ci.yml.

jobs:
  changes:
    name: Detect changed paths
    # Measured median 0.2 min, max 0.3, over 40 successful runs.
    timeout-minutes: 5
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            admin:
              - 'auntieos-admin/src/**'
              - 'auntieos-admin/index.html'
              - 'auntieos-admin/package.json'
              - 'auntieos-admin/vite.config.ts'
              - 'auntieos-admin/firebase.json'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/preview.yml'
            portal:
              - 'mytribe/web/src/**'
              - 'mytribe/web/index.html'
              - 'mytribe/web/public/**'
              - 'mytribe/web/package.json'
              - 'mytribe/web/vite.config.ts'
              - 'mytribe/firebase.json'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/preview.yml'

  preview:
    name: Deploy preview channel
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    # Sized against what this job costs AFTER the duplicate unit suite came out
    # of it, not before. Measured steps over 27 successful runs: checkout 4s,
    # setup-node 3s, npm ci 12s, typecheck 5s, build 7s, deploy 44s (max 69s),
    # so about 1.3 min. 10 leaves room for the deploy step, which talks to
    # Firebase and is the one part of this job with real variance.
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # `pull_request` (not pull_request_target) on purpose: a fork PR then runs
    # WITHOUT access to the service account, so untrusted code can never reach
    # the deploy credential. Same-repo branches get the secret and deploy.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: auntieos-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Root lockfile: auntieos-admin is an npm workspace member as of
          # PR25a (see root package.json's "workspaces"), so its deps
          # resolve at the repo root, not from a lockfile of its own.
          cache-dependency-path: package-lock.json

      # Overrides the job default so the install runs where the workspace
      # root (and its lockfile) actually is. Every later step keeps the job
      # default of auntieos-admin.
      - run: npm ci
        working-directory: .

      # Do not preview something that does not compile.
      - name: Typecheck
        run: npx tsc --noEmit

      # NO UNIT SUITE HERE, deliberately, since 2026-08-18. This job used to run
      # `npm test`, which is the same command, the same vitest config and the
      # same specs that ci.yml's `React admin` job runs against the same commit
      # of the same pull request. It measured 5.7 minutes of every preview, or
      # roughly eighteen runner-hours a month, to learn a second time what the
      # other workflow had already reported on the same check page.
      #
      # What keeps that safe is that ci.yml's `admin` path filter is now a
      # SUPERSET of the `admin` filter above: every path that can trigger this
      # job also triggers the job that runs the suite. The one exception is a
      # change to this workflow file alone, which touches no application code
      # and so has nothing for the suite to say about it.
      #
      # The Build step below is still a gate on compiling, not just a bundler:
      # `npm run build` is `tsc --noEmit && vite build`, so a preview is still
      # never published from code that does not typecheck.
      - name: Build
        run: npm run build

      # The service account is an EXTERNAL secret only the operator can issue.
      # Until it exists the job says so plainly rather than failing every PR,
      # because a red X that always means "not configured yet" teaches people to
      # ignore red X's.
      - name: Check for the deploy credential
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
        run: |
          if [ -n "$SA" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to preview channel
        if: steps.cred.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
          projectId: auntieos-ttpc
          entryPoint: auntieos-admin
          # The hosting TARGET, not the site id. "app" resolves to the
          # auntieos-ttpc site via auntieos-admin/.firebaserc. Naming the target
          # is the point: the site called "auntieos" is the SOTU status page, not
          # this app, so site ids read backwards to anyone who has not been told.
          target: app
          expires: 7d

      - name: Report no preview
        if: steps.cred.outputs.present != 'true'
        run: |
          echo "::warning title=No preview deployed::FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC is not set, so no preview URL was published. The build and tests above still ran."
          echo "Set it with: gh secret set FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC --repo sydeast/tribetails < service-account.json"

  preview-portal:
    name: Deploy portal preview channel
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    # Same shape as the admin job above: about 1.2 min once the duplicate unit
    # suite is gone (checkout 4s, npm ci 12s, build 4s, deploy 38s, max 52s).
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: mytribe/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Root lockfile, same as the admin job: mytribe/web is a workspace
          # member and has no lockfile of its own.
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      # Do not preview something that does not compile.
      - name: Typecheck
        run: npx tsc --noEmit

      # No unit suite here either, for the reason spelled out in the admin job
      # above: ci.yml's `Kinfolk portal` job runs this exact `npm test` against
      # this exact commit, and ci.yml's `portal` filter covers every path that
      # can trigger this job. Measured at 46 seconds a run.
      - name: Build
        run: npm run build

      - name: Check for the deploy credential
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
        run: |
          if [ -n "$SA" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to preview channel
        if: steps.cred.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
          projectId: auntieos-ttpc
          # `mytribe`, where the portal's firebase.json and .firebaserc live.
          # The build ran in mytribe/web; the hosting config one level up is
          # what maps the target to a site and carries the /share/** rewrite.
          entryPoint: mytribe
          # `kinfolk_portal`, the target scripts/release.sh deploys to
          # production (hosting:kinfolk_portal), so the preview mirrors the
          # live site. NOT `mytribe_beta`: that target points at the
          # mytribe-kinfolk-beta site, which is a different audience, and a
          # preview that matched the beta rather than production would be
          # judged against the wrong thing.
          target: kinfolk_portal
          expires: 7d

      - name: Report no preview
        if: steps.cred.outputs.present != 'true'
        run: |
          echo "::warning title=No portal preview deployed::FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC is not set, so no preview URL was published. The build and tests above still ran."
          echo "Set it with: gh secret set FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC --repo sydeast/tribetails < service-account.json"
