name: PR preview

# Deploys each web app to a Firebase Hosting PREVIEW CHANNEL and comments the
# URL on the pull request, so a change can be looked at before it merges.
#
# Why Firebase preview channels and not Vercel: both apps depend on Hosting
# rewrites that map onto Cloud Functions. The admin maps /api/generate,
# /api/send-message and /api/cloudinary/sign-upload (auntieos-admin/firebase.json);
# the portal maps /share/** onto getSharedKinTalePage (mytribe/firebase.json). A
# Vercel preview would carry neither, so Ask Auntie, broadcast send, media upload
# and shared KinTale pages would all be broken in every preview, which is exactly
# the kind of change most worth previewing. A preview channel is the same
# platform as production, so what you look at behaves like the real thing.
#
# The channel is per pull request. It carries a 7d expiry AND is deleted when the
# pull request closes, because the expiry alone was not enough: this comment used
# to claim old previews could not pile up against a site's channel limit, and on
# 2026-08-22 `auntieos-ttpc` held 51 channels against a cap of 50 and every new
# preview failed with `429 channel quota reached`. 45 of the 51 belonged to pull
# requests that had already merged. At this repository's merge rate, PRs close far
# faster than a 7d TTL retires their channels, so the TTL is the backstop and the
# close-triggered delete below is the actual reclaim.
#
# BOTH APPS, since 2026-08-16. Until then this file deployed the admin only, so
# a portal change could not be clicked before it merged: the one half of the
# product whose defects get found by walking it was the half with no preview.
# A portal-only PR published an admin URL and looked like it had been previewed.
#
# SHARED CHANGES PREVIEW BOTH. `packages/**` and the root lockfile are inputs to
# each app's bundle, so a change to either is a change to both, and previewing
# only one would leave the other's regression to be found in production.

on:
  pull_request:
    branches: ['**']
    # `closed` is added to GitHub's default opened/synchronize/reopened so the
    # prune job below can fire. The deploy jobs each guard against it.
    types: [opened, synchronize, reopened, closed]
    # The UNION of what the two jobs care about. The per-app split is the
    # `changes` job below; a workflow-level path filter cannot express it,
    # because `paths` gates the whole file.
    paths:
      - 'auntieos-admin/src/**'
      - 'auntieos-admin/index.html'
      - 'auntieos-admin/package.json'
      - 'auntieos-admin/vite.config.ts'
      - 'auntieos-admin/firebase.json'
      - 'mytribe/web/src/**'
      - 'mytribe/web/index.html'
      - 'mytribe/web/public/**'
      - 'mytribe/web/package.json'
      - 'mytribe/web/vite.config.ts'
      - 'mytribe/firebase.json'
      # Both apps are npm workspace members (PR25a): they resolve against the
      # ROOT package.json/package-lock.json, not one of their own, and
      # packages/geo is a workspace dependency both declare. Same reasoning as
      # ci.yml's `admin` and `portal` jobs.
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/preview.yml'

# Left cancelling, unlike ci.yml's group. This workflow triggers on
# `pull_request` only, so no run here is ever the one the release gate reads on
# main, and a superseded preview is a preview of a commit nobody will look at.
concurrency:
  group: preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Every job carries a `timeout-minutes`; GitHub's default of 360 would let a
# hung deploy park a runner for six hours. Ceilings are sized from measured
# durations of recent successful runs. See the same block in ci.yml.

jobs:
  changes:
    name: Detect changed paths
    # Measured median 0.2 min, max 0.3, over 40 successful runs.
    timeout-minutes: 5
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            admin:
              - 'auntieos-admin/src/**'
              - 'auntieos-admin/index.html'
              - 'auntieos-admin/package.json'
              - 'auntieos-admin/vite.config.ts'
              - 'auntieos-admin/firebase.json'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/preview.yml'
            portal:
              - 'mytribe/web/src/**'
              - 'mytribe/web/index.html'
              - 'mytribe/web/public/**'
              - 'mytribe/web/package.json'
              - 'mytribe/web/vite.config.ts'
              - 'mytribe/firebase.json'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/preview.yml'

  preview:
    name: Deploy preview channel
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.admin == 'true'
    # Sized against what this job costs AFTER the duplicate unit suite came out
    # of it, not before. Measured steps over 27 successful runs: checkout 4s,
    # setup-node 3s, npm ci 12s, typecheck 5s, build 7s, deploy 44s (max 69s),
    # so about 1.3 min. 10 leaves room for the deploy step, which talks to
    # Firebase and is the one part of this job with real variance.
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # `pull_request` (not pull_request_target) on purpose: a fork PR then runs
    # WITHOUT access to the service account, so untrusted code can never reach
    # the deploy credential. Same-repo branches get the secret and deploy.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: auntieos-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Root lockfile: auntieos-admin is an npm workspace member as of
          # PR25a (see root package.json's "workspaces"), so its deps
          # resolve at the repo root, not from a lockfile of its own.
          cache-dependency-path: package-lock.json

      # Overrides the job default so the install runs where the workspace
      # root (and its lockfile) actually is. Every later step keeps the job
      # default of auntieos-admin.
      - run: npm ci
        working-directory: .

      # Do not preview something that does not compile.
      - name: Typecheck
        run: npx tsc --noEmit

      # NO UNIT SUITE HERE, deliberately, since 2026-08-18. This job used to run
      # `npm test`, which is the same command, the same vitest config and the
      # same specs that ci.yml's `React admin` job runs against the same commit
      # of the same pull request. It measured 5.7 minutes of every preview, or
      # roughly eighteen runner-hours a month, to learn a second time what the
      # other workflow had already reported on the same check page.
      #
      # What keeps that safe is that ci.yml's `admin` path filter is now a
      # SUPERSET of the `admin` filter above: every path that can trigger this
      # job also triggers the job that runs the suite. The one exception is a
      # change to this workflow file alone, which touches no application code
      # and so has nothing for the suite to say about it.
      #
      # The Build step below is still a gate on compiling, not just a bundler:
      # `npm run build` is `tsc --noEmit && vite build`, so a preview is still
      # never published from code that does not typecheck.
      # WHERE THE CLIENT BUILD CONFIG COMES FROM IN CI (scripts/client-secrets.mjs).
      # A release resolves these from Google Secret Manager. A runner has no
      # gcloud and no credentials, and it must never get any: this workflow is
      # `pull_request`, so a fork PR runs untrusted code, and reaching Secret
      # Manager from here would hand it a door the deploy credential is
      # deliberately kept behind. So CI mirrors the values as REPO SECRETS named
      # exactly after the Secret Manager secrets they copy, which is what makes a
      # drift between the two visible rather than mysterious.
      #
      # An unset repo secret expands to an empty string and the preview builds
      # anyway, degrading exactly the way the app degrades: no Sentry reporting,
      # RouteMap draws its SVG polyline, admin App Check reports `unconfigured`.
      # The step after this one names each one that was empty. A preview is a
      # look at a change, and failing every fork PR over a missing DSN would cost
      # more than the DSN is worth here.
      #
      # VITE_APPCHECK_DEBUG_TOKEN is absent on purpose and must stay absent: it
      # bypasses App Check attestation and is per-developer.
      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.ADMIN_WEB_SENTRY_DSN }}
          VITE_ADMIN_APPCHECK_SITE_KEY: ${{ secrets.ADMIN_WEB_APPCHECK_SITE_KEY }}
          # Derived, never stored: the commit this preview was built from, so a
          # Sentry event raised in a preview names the code it came from.
          VITE_SENTRY_RELEASE: ${{ github.event.pull_request.head.sha }}

      - name: Report client config this preview built without
        env:
          VITE_SENTRY_DSN: ${{ secrets.ADMIN_WEB_SENTRY_DSN }}
          VITE_ADMIN_APPCHECK_SITE_KEY: ${{ secrets.ADMIN_WEB_APPCHECK_SITE_KEY }}
        run: |
          missing=""
          for v in VITE_SENTRY_DSN VITE_ADMIN_APPCHECK_SITE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Preview built without client config::This admin preview compiled empty values for:$missing. Sentry reporting is off in it and App Check reads 'unconfigured'. Fork PRs never get repo secrets; on a same-repo PR, mirror the Secret Manager value: gh secret set ADMIN_WEB_SENTRY_DSN --repo sydeast/tribetails"
          else
            echo "All declared admin client config was present."
          fi

      # The service account is an EXTERNAL secret only the operator can issue.
      # Until it exists the job says so plainly rather than failing every PR,
      # because a red X that always means "not configured yet" teaches people to
      # ignore red X's.
      - name: Check for the deploy credential
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
        run: |
          if [ -n "$SA" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to preview channel
        if: steps.cred.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
          projectId: auntieos-ttpc
          entryPoint: auntieos-admin
          # The hosting TARGET, not the site id. "app" resolves to the
          # auntieos-ttpc site via auntieos-admin/.firebaserc. Naming the target
          # is the point: the site called "auntieos" is the SOTU status page, not
          # this app, so site ids read backwards to anyone who has not been told.
          target: app
          expires: 7d
          # PINNED, and the default is what makes this necessary. Leave it out
          # and the action runs `npx firebase-tools@latest`, which re-resolves
          # the package on every run and rewrites the shared npx cache under
          # $HOME/.npm/_npx. Three self-hosted runners share one $HOME on this
          # machine (issue #588), so two preview jobs can be reading that cache
          # while a third is writing it. On 2026-08-25 both preview jobs on
          # PR #591 died twice with `TypeError: bind.call is not a function`
          # from .npm/_npx/ba4f1959e38407b5/node_modules/hasown/index.js, a
          # half-written module read mid-install. The build steps above had
          # passed; only the deploy died, which reads as a broken PR and is not
          # one.
          #
          # A PIN DOES NOT FIX THE SHARING, and #588 stays open for that. It
          # removes one exposure: a fixed version resolves to a cache entry that
          # is written once and then only ever read. 15.18.0 is the version
          # `prune-preview-channels` at the bottom of this file already pins, so
          # the whole workflow now agrees on one firebase-tools.
          firebaseToolsVersion: 15.18.0

      - name: Report no preview
        if: steps.cred.outputs.present != 'true'
        run: |
          echo "::warning title=No preview deployed::FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC is not set, so no preview URL was published. The build and tests above still ran."
          echo "Set it with: gh secret set FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC --repo sydeast/tribetails < service-account.json"

  preview-portal:
    name: Deploy portal preview channel
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.portal == 'true'
    # Same shape as the admin job above: about 1.2 min once the duplicate unit
    # suite is gone (checkout 4s, npm ci 12s, build 4s, deploy 38s, max 52s).
    timeout-minutes: 10
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: mytribe/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Root lockfile, same as the admin job: mytribe/web is a workspace
          # member and has no lockfile of its own.
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .

      # Do not preview something that does not compile.
      - name: Typecheck
        run: npx tsc --noEmit

      # No unit suite here either, for the reason spelled out in the admin job
      # above: ci.yml's `Kinfolk portal` job runs this exact `npm test` against
      # this exact commit, and ci.yml's `portal` filter covers every path that
      # can trigger this job. Measured at 46 seconds a run.
      # Same mirror as the admin job above, with the portal's own names. The two
      # apps are separate Sentry projects (`auntieos-admin` and `mytribe-web`),
      # so VITE_SENTRY_DSN is a DIFFERENT value here. That is exactly why each
      # app declares its own secret instead of sharing one name.
      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.PORTAL_WEB_SENTRY_DSN }}
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.PORTAL_WEB_MAPBOX_PUBLIC_TOKEN }}
          VITE_SENTRY_RELEASE: ${{ github.event.pull_request.head.sha }}

      - name: Report client config this preview built without
        env:
          VITE_SENTRY_DSN: ${{ secrets.PORTAL_WEB_SENTRY_DSN }}
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ secrets.PORTAL_WEB_MAPBOX_PUBLIC_TOKEN }}
        run: |
          missing=""
          for v in VITE_SENTRY_DSN VITE_MAPBOX_PUBLIC_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Preview built without client config::This portal preview compiled empty values for:$missing. Sentry reporting is off in it and the visit route falls back to the SVG polyline instead of the Mapbox map. Fork PRs never get repo secrets; on a same-repo PR, mirror the Secret Manager value: gh secret set PORTAL_WEB_MAPBOX_PUBLIC_TOKEN --repo sydeast/tribetails"
          else
            echo "All declared portal client config was present."
          fi

      - name: Check for the deploy credential
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
        run: |
          if [ -n "$SA" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to preview channel
        if: steps.cred.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
          projectId: auntieos-ttpc
          # `mytribe`, where the portal's firebase.json and .firebaserc live.
          # The build ran in mytribe/web; the hosting config one level up is
          # what maps the target to a site and carries the /share/** rewrite.
          entryPoint: mytribe
          # `kinfolk_portal`, the target scripts/release.sh deploys to
          # production (hosting:kinfolk_portal), so the preview mirrors the
          # live site. NOT `mytribe_beta`: that target points at the
          # mytribe-kinfolk-beta site, which is a different audience, and a
          # preview that matched the beta rather than production would be
          # judged against the wrong thing.
          target: kinfolk_portal
          expires: 7d
          # Same pin and the same reason as the admin job above. Both jobs run
          # concurrently against one shared npx cache, so pinning only one of
          # them would leave the race in place.
          firebaseToolsVersion: 15.18.0

      - name: Report no preview
        if: steps.cred.outputs.present != 'true'
        run: |
          echo "::warning title=No portal preview deployed::FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC is not set, so no preview URL was published. The build and tests above still ran."
          echo "Set it with: gh secret set FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC --repo sydeast/tribetails < service-account.json"

  # ---------------------------------------------------------------------------
  # Reclaim the channel when the pull request closes.
  # ---------------------------------------------------------------------------
  #
  # WHY THIS EXISTS. Firebase Hosting caps preview channels at 50 per site. On
  # 2026-08-22 `auntieos-ttpc` held 51 and every new preview failed with
  # `429 ... channel quota reached`, which reads as a broken PR and is not one.
  # 45 of those 51 belonged to pull requests that had already merged. The 7d
  # expiry was doing its job; it was simply slower than the merge rate.
  #
  # It tries BOTH sites, because a PR touching `packages/**` deploys to both and
  # a PR touching one app deploys to one. `--force` is required: there is no TTY
  # here, and without it the command waits on a prompt until the job times out.
  #
  # IT NEVER FAILS THE RUN. The pull request is already closed and its outcome
  # was decided by the jobs that ran before it; a housekeeping step that turns a
  # merged PR red teaches people to ignore red. A channel that was never created
  # (the PR touched no previewable path) 404s here, which is the ordinary case
  # rather than a problem, so the step reports what it did and exits 0.
  prune-preview-channels:
    name: Reclaim preview channels
    if: github.event.action == 'closed'
    # Two small delete calls plus npm resolution. 5 is generous, and stops a
    # hung prompt parking a runner.
    timeout-minutes: 5
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Same gate the deploy jobs use. Without the service account there is
      # nothing to authenticate with, and saying so beats a confusing failure.
      - name: Check for the deploy credential
        id: cred
        env:
          CRED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
        run: |
          if [ -n "$CRED" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete this PR's preview channels
        if: steps.cred.outputs.present == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # RUNNER_TEMP, not /tmp: on a self-hosted runner the disk persists
          # between jobs, and RUNNER_TEMP is the path the runner clears itself.
          sa="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SA" > "$sa"
          export GOOGLE_APPLICATION_CREDENTIALS="$sa"
          # The channel id FirebaseExtended/action-hosting-deploy generates:
          # `pr<number>-<head ref>`, non-alphanumerics collapsed to `-`, then
          # truncated to 26 characters. Derived here because the deploy action
          # does not surface the id it chose.
          slug="$(printf 'pr%s-%s' "$PR_NUMBER" "$HEAD_REF" | tr -c '[:alnum:]-' '-' | cut -c1-26)"
          echo "Reclaiming channel: $slug"
          # --config is REQUIRED and its absence is why the first version of
          # this job was green and did nothing. `hosting:channel:delete` is a
          # hosting command, so firebase-tools looks for a firebase.json in the
          # working directory; at the repository root there is none, and it
          # exits 1 with "Not in a Firebase app directory". The old code read
          # that as "no channel to delete" and reported success. Any
          # firebase.json in the repo resolves the project; --site is what
          # actually selects which site to act on.
          rc_any_error=0
          for site in auntieos-ttpc kinfolk-portal; do
            err="$RUNNER_TEMP/delete-$site.err"
            if npx --yes firebase-tools@15.18.0 hosting:channel:delete "$slug" \
                 --site "$site" --project auntieos-ttpc \
                 --config mytribe/firebase.json --force 2>"$err"; then
              echo "  deleted from $site"
            elif grep -qiE 'not found|does not exist|404' "$err"; then
              # The ordinary case: this PR touched no previewable path, so no
              # channel was ever created on this site.
              echo "  nothing to delete on $site (no channel)"
            else
              # Anything else is a real failure and must not read as success.
              # It still does not fail the job (the PR is already closed), but
              # it is surfaced so a silently-broken prune cannot recur.
              echo "::warning title=Preview channel not reclaimed::Deleting $slug from $site failed for a reason other than the channel being absent. The channel may still be counting against the 50-per-site cap."
              sed 's/^/    /' "$err" | head -5
              rc_any_error=1
            fi
          done
          if [ "$rc_any_error" = "1" ]; then
            echo "One or more sites reported an unexpected error above."
          fi
          shred -u "$sa" 2>/dev/null || true

      - name: Report no credential
        if: steps.cred.outputs.present != 'true'
        run: |
          echo "::warning title=Preview channel not reclaimed::FIREBASE_SERVICE_ACCOUNT_AUNTIEOS_TTPC is not set, so this PR's preview channel was left in place and still counts against the 50-per-site cap."
