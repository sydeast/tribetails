<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTribe, The Kin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     MyTribe DESIGN SYSTEM  (com.kinfolk.portal, pet parent web)
     Identity: bright, sunny, glassmorphic. Top-nav airy consumer
     web (NOT AuntieOS's dark left-rail admin). Signature = frosted
     glass + the Tribe Gradient. Full-web layout; mobile collapses
     responsively (single column + bottom tabs).
     Palette locked to brandColors.md / KinfolkBrand. Fonts AuntieOS
     does not use: Young Serif + Bricolage Grotesque + DM Mono.
     ==> This <style> block is the shared system; reuse verbatim.
     ============================================================ */
  :root{
    --cream:#FBFBF9; --navy:#11131F;
    --orange:#DF8431; --pink:#D55C87; --teal:#0A8595;
    --purple:#74538A; --coral:#D5535A;
    --navy-soft:rgba(17,19,31,.78); --navy-muted:rgba(17,19,31,.55);
    --hairline:rgba(17,19,31,.10);
    --glass:rgba(255,255,255,.62); --glass-dim:rgba(255,255,255,.40);
    --glass-border:rgba(255,255,255,.7);
    --serif:"Young Serif",serif; --sans:"Bricolage Grotesque",sans-serif; --mono:"DM Mono",monospace;
    --ease:cubic-bezier(.22,.8,.24,1);
    --shadow-card:0 14px 34px -18px rgba(17,19,31,.30);
    --shadow-lift:0 22px 46px -20px rgba(17,19,31,.36);
    --shadow-warm:0 16px 34px -16px rgba(223,132,49,.55);
    /* canonical brand gradients (brandColors.md) */
    --tribe-grad:linear-gradient(135deg,#df8431,#d55c87,#0a8595);
    --orange-pink:linear-gradient(to bottom right,#df8431,#d55c87);
    --teal-purple:linear-gradient(to bottom right,#0a8595,#74538a);
    --maxw:1140px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);color:var(--navy);min-height:100vh;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120vmax 70vmax at 82% -10%, rgba(223,132,49,.20), transparent 55%),
      radial-gradient(110vmax 70vmax at 5% 0%, rgba(213,92,135,.16), transparent 52%),
      radial-gradient(130vmax 80vmax at 50% 118%, rgba(10,133,149,.16), transparent 55%),
      var(--cream);
    overflow-x:hidden;
  }
  .orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.42;z-index:0;pointer-events:none;
    animation:drift 26s var(--ease) infinite alternate;}
  .orb.a{width:32vmax;height:32vmax;top:-6vmax;right:-4vmax;background:radial-gradient(circle,var(--orange),transparent 64%);}
  .orb.b{width:30vmax;height:30vmax;bottom:-10vmax;left:-8vmax;background:radial-gradient(circle,var(--teal),transparent 64%);animation-delay:-10s;}
  @keyframes drift{to{transform:translate(2vmax,2vmax) scale(1.08);}}

  /* ===== top nav ===== */
  .nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    background:rgba(251,251,249,.72);border-bottom:1px solid var(--hairline);}
  .nav .in{max-width:var(--maxw);margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;}
  .wordmark{font-family:var(--serif);font-size:23px;letter-spacing:-.01em;line-height:1;white-space:nowrap;}
  .wordmark .grad{background:var(--tribe-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .navlinks{display:flex;gap:4px;margin-left:8px;}
  .navlinks a{padding:9px 14px;border-radius:11px;text-decoration:none;color:var(--navy-soft);font-weight:600;
    font-size:14.5px;transition:.2s var(--ease);}
  .navlinks a:hover{background:rgba(223,132,49,.12);color:var(--navy);}
  .navlinks a.on{background:var(--navy);color:#fff;}
  .nav .right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .iconbtn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:17px;cursor:pointer;
    background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--shadow-card);position:relative;
    transition:.2s var(--ease);}
  .iconbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}
  .iconbtn .ping{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--coral);
    box-shadow:0 0 0 3px var(--cream);}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--tribe-grad);display:grid;place-items:center;
    color:#fff;font-family:var(--serif);font-size:18px;cursor:pointer;box-shadow:var(--shadow-warm);}

  /* ===== layout shell ===== */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:34px 24px 80px;position:relative;z-index:1;}

  .hero-greet{margin-bottom:24px;animation:rise .6s var(--ease) both;}
  .hero-greet .kick{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:8px;}
  .hero-greet h1{font-family:var(--serif);font-size:clamp(30px,4.4vw,46px);line-height:1.05;letter-spacing:-.01em;}
  .hero-greet h1 span{color:var(--pink);}

  /* glass primitives */
  .glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:22px;
    box-shadow:var(--shadow-card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .card{padding:22px;}
  .sectlabel{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-family:var(--mono);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--navy-muted);}
  .sectlabel a{margin-left:auto;color:var(--teal);text-decoration:none;font-weight:500;letter-spacing:.04em;}
  h3.title{font-family:var(--serif);font-size:20px;font-weight:400;display:flex;align-items:center;gap:8px;}
  .sub{color:var(--navy-muted);font-size:13px;margin-top:3px;}

  /* buttons */
  .btn{border:none;cursor:pointer;border-radius:14px;padding:14px 18px;font-family:var(--sans);font-size:14.5px;
    font-weight:700;color:#fff;background:var(--navy);display:inline-flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:var(--shadow-card);transition:.2s var(--ease);text-decoration:none;}
  .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);}
  .btn.grad{background:var(--tribe-grad);box-shadow:var(--shadow-warm);}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--hairline);box-shadow:none;}
  .btn.ghost:hover{background:rgba(223,132,49,.10);}
  .btn.block{width:100%;}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:500;padding:4px 10px;border-radius:20px;letter-spacing:.04em;}
  .chip.go{background:rgba(10,133,149,.14);color:var(--teal);}
  .chip.warm{background:rgba(223,132,49,.16);color:var(--orange);}
  .chip.done{background:rgba(116,83,138,.14);color:var(--purple);}

  /* ===== Live Visit hero (Tribe Gradient) ===== */
  .live{padding:24px 26px;color:#fff;border-radius:24px;position:relative;overflow:hidden;background:var(--tribe-grad);
    box-shadow:var(--shadow-warm);margin-bottom:30px;animation:rise .6s var(--ease) .08s both;}
  .live::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 88% 0%,rgba(255,255,255,.32),transparent 55%);pointer-events:none;}
  .live .lrow{display:flex;align-items:center;gap:7px;position:relative;}
  .live .tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;}
  .pulse{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1.6s var(--ease) infinite;}
  @keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
  .live h2{font-family:var(--serif);font-size:26px;margin:12px 0 4px;position:relative;}
  .live p{font-size:14px;opacity:.93;position:relative;max-width:60ch;line-height:1.5;}
  .live .lwho{display:flex;align-items:center;gap:13px;margin-top:18px;position:relative;}
  .live .lav{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:25px;box-shadow:0 6px 14px -6px rgba(0,0,0,.4);overflow:hidden;}
  .live .lwho b{font-size:15px;font-weight:700;} .live .lwho small{display:block;font-size:12px;opacity:.86;font-family:var(--mono);}
  .live .track{flex:1;min-width:120px;height:7px;border-radius:99px;background:rgba(255,255,255,.3);position:relative;overflow:hidden;}
  .live .track i{position:absolute;inset:0 38% 0 0;background:#fff;border-radius:99px;}

  /* ===== two-column content ===== */
  .cols{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:start;}
  .stack{display:flex;flex-direction:column;gap:24px;}

  /* booking rows */
  .visit{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;cursor:pointer;border:1px solid transparent;transition:.2s var(--ease);}
  .visit:hover{background:rgba(255,255,255,.5);border-color:var(--glass-border);transform:translateX(3px);}
  .visit .cal{flex:0 0 auto;width:52px;text-align:center;border-radius:13px;overflow:hidden;border:1px solid var(--hairline);font-family:var(--mono);background:#fff;}
  .visit .cal .m{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:3px 0;}
  .visit.v1 .cal .m{background:var(--orange);} .visit.v2 .cal .m{background:var(--purple);} .visit.v3 .cal .m{background:var(--teal);}
  .visit .cal .d{font-family:var(--serif);font-size:22px;padding:4px 0 5px;}
  .visit .info{flex:1;} .visit .info b{font-size:15px;font-weight:600;} .visit .info small{display:block;color:var(--navy-muted);font-size:12.5px;margin-top:2px;}
  .visit .pet{width:42px;height:42px;border-radius:13px;overflow:hidden;display:grid;place-items:center;font-size:23px;background:rgba(223,132,49,.12);}

  /* KinTale cards */
  .tale{display:flex;gap:14px;padding:15px;border-radius:16px;cursor:pointer;transition:.2s var(--ease);border:1px solid transparent;}
  .tale:hover{background:rgba(255,255,255,.5);border-color:var(--glass-border);transform:translateX(3px);}
  .tale .photo{flex:0 0 auto;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:27px;overflow:hidden;}
  .tale.a1 .photo{background:rgba(223,132,49,.16);} .tale.a2 .photo{background:rgba(10,133,149,.14);} .tale.a3 .photo{background:rgba(213,92,135,.14);}
  .tale .tb b{font-size:14.5px;font-weight:600;} .tale .tb p{font-size:13px;color:var(--navy-soft);line-height:1.46;margin-top:3px;}
  .tale .tb .meta{font-family:var(--mono);font-size:10.5px;color:var(--navy-muted);margin-top:8px;letter-spacing:.04em;}
  .heart{color:var(--coral);}

  /* Kin roster (Your Tribe) */
  .kinrow{display:flex;align-items:center;gap:13px;padding:11px;border-radius:14px;cursor:pointer;transition:.2s var(--ease);}
  .kinrow:hover{background:rgba(255,255,255,.55);transform:translateX(2px);}
  .kinrow .pic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:25px;border:2px solid;overflow:hidden;flex:0 0 auto;}
  .kinrow.k1 .pic{border-color:var(--orange);} .kinrow.k2 .pic{border-color:var(--teal);} .kinrow.k3 .pic{border-color:var(--pink);} .kinrow.k4 .pic{border-color:var(--purple);}
  .kinrow b{font-size:14.5px;font-weight:600;} .kinrow small{display:block;font-size:11.5px;color:var(--navy-muted);font-family:var(--mono);}
  .kinrow.add .pic{border:2px dashed var(--hairline);color:var(--navy-muted);background:var(--glass-dim);font-size:22px;}

  .footnote{font-family:var(--mono);font-size:11px;color:var(--navy-muted);text-align:center;margin-top:40px;}
  .footnote b{background:var(--tribe-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:500;}

  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  .d1{animation:rise .6s var(--ease) .14s both;}.d2{animation:rise .6s var(--ease) .2s both;}
  .d3{animation:rise .6s var(--ease) .26s both;}.d4{animation:rise .6s var(--ease) .32s both;}

  /* ===== responsive: tablet + phone ===== */
  @media (max-width:880px){
    .cols{grid-template-columns:1fr;}
    .navlinks{display:none;}
    .wrap{padding:24px 16px 96px;}
  }
  .tabbar{display:none;}
  @media (max-width:880px){
    .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:30;justify-content:space-around;
      padding:10px 6px;border-radius:22px;background:rgba(255,255,255,.8);border:1px solid var(--glass-border);
      box-shadow:0 -8px 30px -16px rgba(17,19,31,.4);backdrop-filter:blur(20px);}
    .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:20px;color:var(--navy-muted);text-decoration:none;}
    .tabbar a small{font-size:10px;font-family:var(--mono);} .tabbar a.on{color:var(--orange);}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}

  /* ============================================================
     SCREEN CSS: The Kin (pet roster grid). Same tokens, same feel.
     Builds on .glass/.card; adds the responsive 3-up pet card.
     ============================================================ */
  .titlerow{display:flex;align-items:center;gap:16px;margin:0 2px 26px;}
  .titlerow h2{font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);font-weight:400;line-height:1;letter-spacing:-.01em;}
  .titlerow .sub{margin-top:7px;max-width:48ch;}
  .titlerow .btn{margin-left:auto;flex:0 0 auto;}

  .kingrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch;}
  @media (max-width:880px){.kingrid{grid-template-columns:1fr 1fr;}}
  @media (max-width:560px){.kingrid{grid-template-columns:1fr;}}

  .petcard{font-family:var(--sans);padding:18px;cursor:pointer;display:flex;flex-direction:column;text-align:left;
    transition:.2s var(--ease);width:100%;animation:rise .6s var(--ease) both;}
  .petcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);}
  .petcard .pphoto{width:100%;aspect-ratio:4/3;border-radius:16px;display:grid;place-items:center;
    font-size:62px;overflow:hidden;margin-bottom:14px;}
  .petcard.p1 .pphoto{background:rgba(223,132,49,.16);}
  .petcard.p2 .pphoto{background:rgba(10,133,149,.14);}
  .petcard.p3 .pphoto{background:rgba(213,92,135,.14);}
  .petcard.p4 .pphoto{background:rgba(116,83,138,.14);}
  .petcard .pname{font-family:var(--serif);font-size:22px;font-weight:400;line-height:1.1;}
  .petcard .pbreed{font-size:13.5px;color:var(--navy-soft);margin-top:5px;}
  .petcard .page{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--navy-muted);margin-top:9px;}

  /* memorial variant: In our hearts (Family Purple) */
  .petcard.memorial{background:rgba(116,83,138,.08);border-color:rgba(116,83,138,.30);}
  .petcard.memorial .pphoto{background:rgba(116,83,138,.16);filter:grayscale(.2);}
  .petcard.memorial .pname{color:var(--purple);}
  .petcard.memorial .mlabel{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--purple);background:rgba(116,83,138,.15);padding:4px 11px;border-radius:20px;margin-bottom:12px;}
  .petcard.memorial .page{color:var(--purple);opacity:.85;}

  /* add-new card (dashed) */
  .petcard.addcard{border:2px dashed var(--hairline);background:var(--glass-dim);box-shadow:none;
    align-items:center;justify-content:center;text-align:center;min-height:236px;}
  .petcard.addcard:hover{border-color:var(--orange);background:rgba(223,132,49,.06);transform:translateY(-4px);}
  .petcard.addcard .plus{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
    font-size:30px;color:#fff;background:var(--tribe-grad);box-shadow:var(--shadow-warm);margin-bottom:12px;}
  .petcard.addcard b{font-family:var(--serif);font-size:18px;font-weight:400;}
  .petcard.addcard small{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--navy-muted);margin-top:5px;}

  /* empty-state (secondary example block) */
  .emptystate{padding:48px 26px;text-align:center;align-items:center;margin-top:24px;}
  .emptystate .ehug{font-size:46px;margin-bottom:14px;}
  .emptystate h3{font-family:var(--serif);font-size:24px;font-weight:400;}
  .emptystate p{font-size:14px;color:var(--navy-soft);line-height:1.55;max-width:46ch;margin:10px auto 0;}

  .d-a{animation-delay:.14s;}.d-b{animation-delay:.18s;}.d-c{animation-delay:.22s;}
  .d-d{animation-delay:.26s;}.d-e{animation-delay:.30s;}.d-f{animation-delay:.34s;}
</style>
</head>
<body>
  <span class="orb a"></span><span class="orb b"></span>

  <!-- top nav: active link = Tribe (Kin lives under Tribe) -->
  <nav class="nav">
    <div class="in">
      <div class="wordmark">My<span class="grad">Tribe</span></div>
      <div class="navlinks">
        <a href="#">Home</a>
        <a class="on" href="#">Tribe</a>
        <a href="#">Schedule</a>
        <a href="#">KinTales</a>
        <a href="#">Invoices</a>
      </div>
      <div class="right">
        <div class="iconbtn" aria-label="Notifications">&#128276;<span class="ping"></span></div>
        <div class="avatar">J</div>
      </div>
    </div>
  </nav>

  <div class="wrap">
    <!-- The Kin: title row with Add New (brand gradient button) -->
    <div class="titlerow">
      <div>
        <h2>The Kin</h2>
        <div class="sub">Everyone who shares your home. Tap a card to open the full profile.</div>
      </div>
      <a class="btn grad" href="#">&#43; Add New</a>
    </div>

    <!-- pet roster grid, 3 across desktop -->
    <div class="kingrid">

      <button class="glass petcard p1 d-a" type="button">
        <div class="pphoto">&#128054;</div>
        <div class="pname">Biscuit</div>
        <div class="pbreed">Golden retriever</div>
        <div class="page">4 yrs</div>
      </button>

      <button class="glass petcard p2 d-b" type="button">
        <div class="pphoto">&#128049;</div>
        <div class="pname">Miso</div>
        <div class="pbreed">Tabby cat</div>
        <div class="page">7 yrs</div>
      </button>

      <button class="glass petcard p3 d-c" type="button">
        <div class="pphoto">&#128048;</div>
        <div class="pname">Clover</div>
        <div class="pbreed">Lop bunny</div>
        <div class="page">2 yrs</div>
      </button>

      <button class="glass petcard p4 d-d" type="button">
        <div class="pphoto">&#128031;</div>
        <div class="pname">Pip</div>
        <div class="pbreed">Betta fish</div>
        <div class="page">Age not set</div>
      </button>

      <!-- memorial variant for a deceased pet: "In our hearts" (Family Purple) -->
      <button class="glass petcard memorial d-e" type="button">
        <span class="mlabel">&#10084; In our hearts</span>
        <div class="pphoto">&#128021;</div>
        <div class="pname">Rusty</div>
        <div class="pbreed">Beagle</div>
        <div class="page">No Longer With Us</div>
      </button>

      <!-- add-new card (dashed) at the end -->
      <button class="petcard addcard d-f" type="button">
        <div class="plus">&#43;</div>
        <b>Add New</b>
        <small>NEW KIN PROFILE</small>
      </button>

    </div>

    <!-- ============================================================
         EMPTY STATE (secondary example block). Render this in place
         of .kingrid when the parent has not added any Kin yet.
         ============================================================
    <section class="glass card emptystate">
      <div class="ehug">&#128062;</div>
      <h3>No Kin added yet</h3>
      <p>Add the pets in your home, names, breeds, photos, care details. Tap each card for full profile.</p>
      <a class="btn grad" href="#" style="margin-top:20px;">&#43; Add New</a>
    </section>
    ============================================================ -->

    <!-- Fallback: when a pet has no name saved, the card shows "Unnamed Kin". -->

    <p class="footnote">Cared for by <b>Tribe Tails Pet Care</b></p>
  </div>

  <!-- mobile bottom tabs (shown under 880px). Active = Tribe. -->
  <nav class="tabbar">
    <a href="#">&#127968;<small>Home</small></a>
    <a class="on" href="#">&#128062;<small>Tribe</small></a>
    <a href="#">&#128197;<small>Schedule</small></a>
    <a href="#">&#128221;<small>Tales</small></a>
    <a href="#">&#128100;<small>Account</small></a>
  </nav>
</body>
</html>
