org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin compiler runs in its own JVM (the Kotlin daemon). The wasm IR-to-binary
# phase for this app needs more heap than the Kotlin default (~700m) — the
# Compose UI tree + Coil 3 + Ktor 3 + Firebase JS interop tip it over.
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=512m

kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true

# Compose Multiplatform
org.jetbrains.compose.experimental.wasm.enabled=true

# Allow Compose Desktop packaging on Homebrew JDK (local dev app image).
compose.desktop.packaging.checkJdkVendor=false
