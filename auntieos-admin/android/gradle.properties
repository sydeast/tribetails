org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Note: android.dependency.useConstraints=false was removed because it is
# incompatible with Gradle 9.x AGP and breaks :app:checkDebugClasspath
# (Cannot fingerprint compileVersionMap). Re-enable only with a compatible AGP.

# MAPBOX_DOWNLOADS_TOKEN lives in ~/.gradle/gradle.properties (per-user, outside repo)
# or set MAPBOX_DOWNLOADS_TOKEN as an environment variable.
# The build resolves it via providers.gradleProperty() then System.getenv() in settings.gradle.kts.

# MAPBOX_PUBLIC_TOKEN is a DIFFERENT credential, in the same place. It is the
# `pk.` public token the Maps SDK uses to fetch tiles at RUNTIME, injected as a
# buildConfigField and applied in AuntieOSApp.onCreate. MAPBOX_DOWNLOADS_TOKEN
# above is an `sk.` maven credential that only downloads the SDK at BUILD time
# and cannot authenticate a MapView, which is why both exist.
# Use the UNRESTRICTED mobile token here: Mapbox validates URL restrictions from
# a browser Referer and answers 403 to Maps SDK requests, so the URL-restricted
# web token would leave the maps blank with a new cause.
# A build with no MAPBOX_PUBLIC_TOKEN succeeds; its maps do not draw.


