lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
navigationCompose = "2.10.0"
constraintLayout = "2.2.2"
retrofit = "3.0.0"
okhttp = "5.5.0"
gson = "2.14.0"
firebaseBom = "34.18.0"
coroutines = "1.11.0"
coroutinesPlayServices = "1.11.0"
datastorePreferences = "1.1.7"
browserHelper = "1.10.0"
appcompat = "1.8.0"
twilioVoice = "6.10.4"
googleApiServicesCalendar = "v3-rev20240517-2.0.0"
googleApiClient = "2.9.1"
playServicesAuth = "22.0.0"
coil = "3.6.2"
cloudinary = "3.1.2"
